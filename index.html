<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Number</title>

  <style>
    body{
      margin:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#111;
      font-family:Arial, sans-serif;
    }

    .card{
      background:#1e1e1e;
      padding:40px;
      border-radius:20px;
      box-shadow:0 0 20px rgba(0,255,200,0.3);
      text-align:center;
    }

    .title{
      color:#00ffc8;
      font-size:20px;
      margin-bottom:15px;
      letter-spacing:2px;
    }

    .number{
      color:white;
      font-size:32px;
      font-weight:bold;
    }

    .number a{
      text-decoration:none;
      color:white;
      transition:0.3s;
    }

    .number a:hover{
      color:#00ffc8;
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="title">CONTACT NUMBER</div>

    <div class="number">
      <a href="tel:0719567589">
        0719567589
      </a>
    </div>
  </div>

</body>
